<svg xmlns="http://www.w3.org/2000/svg" width="320" height="34" viewBox="0 0 320 34"><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:18px;font-weight:400;font-style:normal;fill:#716083}.reveal{animation:type 7s steps(28,end) infinite}@keyframes type{0%,5%{width:0}40%,90%{width:310px}100%{width:0}}@media(prefers-color-scheme:dark){text{fill:#BBAACD}}@media(prefers-reduced-motion:reduce){.reveal{animation:none;width:310px}}</style><defs><clipPath id="reveal"><rect class="reveal" width="310" height="34"/></clipPath></defs><text x="0" y="25" clip-path="url(#reveal)">Hi, I'm Jingming Liang.</text></svg>