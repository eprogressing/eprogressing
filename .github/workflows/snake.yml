name: Update contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '23 0 * * *'

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#806294&color_dots=#f0edf4,#ded3e7,#bea5cf,#9975b0,#73508c
            dist/snake-dark.svg?palette=github-dark&color_snake=#d5b3eb&color_dots=#161b22,#302638,#554063,#806294,#b28dca

      - name: Publish generated images on their own branch
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const branch = 'snake-output';
            let parent;
            let baseTree;
            try {
              const ref = await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`});
              parent = ref.data.object.sha;
              const commit = await github.rest.git.getCommit({owner, repo, commit_sha: parent});
              baseTree = commit.data.tree.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const tree = [];
            for (const name of ['snake-light.svg', 'snake-dark.svg']) {
              const content = fs.readFileSync(`dist/${name}`, 'utf8');
              if (!content.includes('<svg')) throw new Error(`Invalid SVG: ${name}`);
              const blob = await github.rest.git.createBlob({owner, repo, content, encoding: 'utf-8'});
              tree.push({path: name, mode: '100644', type: 'blob', sha: blob.data.sha});
            }
            const generated = await github.rest.git.createTree({owner, repo, ...(baseTree ? {base_tree: baseTree} : {}), tree});
            if (generated.data.sha === baseTree) return;
            const commit = await github.rest.git.createCommit({owner, repo, message: 'Refresh contribution snake', tree: generated.data.sha, parents: parent ? [parent] : []});
            if (parent) {
              await github.rest.git.updateRef({owner, repo, ref: `heads/${branch}`, sha: commit.data.sha, force: false});
            } else {
              await github.rest.git.createRef({owner, repo, ref: `refs/heads/${branch}`, sha: commit.data.sha});
            }
